<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lübeck 3D</title>
<style>
html,body{margin:0;height:100%;background:#cfd8de;font:15px/1.4 system-ui,sans-serif;overflow:hidden}
#c{display:block;width:100%;height:100%}
.box{position:fixed;left:12px;top:12px;background:#1c2226e6;color:#eee;padding:10px 14px;border-radius:12px;max-width:360px}
.box a{color:inherit}.box h1{font-size:1.05em;margin:0 0 4px}.small{font-size:.8em;opacity:.8}
#sun{width:100%}
</style>
</head>
<body>
<canvas id="c" aria-label="3D-Modell der Lübecker Altstadt. Ziehen dreht, Mausrad zoomt, rechte Maustaste verschiebt."></canvas>
<div class="box">
  <h1>Lübeck 3D – Pilot</h1>
  <div>Ziehen dreht · Mausrad zoomt · rechte Maustaste verschiebt</div>
  <label class="small">Sonnenstand <input id="sun" type="range" min="0" max="360" value="200"></label>
  <div class="small"><a href="../luebeck/">← zur Pixelkarte</a> · Gebäudemodelle (LoD2): ©GeoBasis-DE/LVermGeo SH/CC BY 4.0 (Quelle verändert)</div>
  <div class="small" id="status">lädt …</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const MODEL = q.get('model') || 'https://pub-39c7cc4b830c4985b269c19eacf46b83.r2.dev/luebeck-3d/altstadt-mitte.glb';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfd8de); scene.fog = new THREE.Fog(0xcfd8de, 900, 2200);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 5000);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .49;
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a490, 1.6));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.8); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -700, right: 700, top: 700, bottom: -700, near: 10, far: 3000 }); scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0xd8d2c4, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function placeSun(deg) { const a = deg * Math.PI / 180; sun.position.set(controls.target.x + Math.sin(a) * 900, 700, controls.target.z + Math.cos(a) * 900); sun.target.position.copy(controls.target) }
new GLTFLoader().load(MODEL, g => {
  const m = g.scene; m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .9, side: THREE.DoubleSide }) } });
  scene.add(m);
  const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3());
  ground.position.y = box.min.y - .2; controls.target.set(c.x, box.min.y + 10, c.z);
  camera.position.set(c.x - 380, box.min.y + 330, c.z + 420); placeSun(200);
  document.getElementById('status').textContent = 'Altstadt-Mitte, 1 km × 1 km, 1.642 Gebäude';
}, undefined, e => { document.getElementById('status').textContent = 'Modell nicht ladbar: ' + e.message });
document.getElementById('sun').oninput = e => placeSun(+e.target.value);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix() }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera) });
</script>
</body>
</html>
